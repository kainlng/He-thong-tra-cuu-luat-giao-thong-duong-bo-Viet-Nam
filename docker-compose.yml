services:
  legal-rag-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: he_thong_tra_cuu_luat_giao_thong
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./app.py:/app/app.py
      - ./src:/app/src
      - ./vector_db:/app/vector_db
      - ./data:/app/data
    restart: unless-stopped
